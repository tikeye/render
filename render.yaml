services:
  - type: web
    name: my-cctv-stream
    env: binary
    buildCommand: "curl -sL https://github.com/bluenviron/mediamtx/releases/download/v1.9.0/mediamtx_v1.9.0_linux_amd64.tar.gz | tar -xz"
    startCommand: "./mediamtx"
    envVars:
      - key: PORT
        value: 8889
      - key: MTX_WEBRTCADDRESS
        value: :8889
